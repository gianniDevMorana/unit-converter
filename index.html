<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit converter</title>
    <link rel="stylesheet" href="unit_converter.css" />
    <script src="unit_converter.js" defer></script>
  </head>
  <body>
    <div class="input">
      <h1>Metric/Imperial Unit Conversion</h1>
      <input id="input-value" type="text" />
      <button id="convert-btn">Convert</button>
    </div>
    <div class="conversion-fields">
      <div>
        <h3 id="length-field">Length (Meter/Feet)</h3>
      </div>
      <div>
        <h3 id="volume-field">Volume (Liters/Gallons)</h3>
      </div>
      <div>
        <h3 id="mass-field">Mass (Kilograms/Pounds)</h3>
      </div>
    </div>
  </body>
</html>
